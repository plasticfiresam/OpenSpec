name: spec-driven
version: 1
description: Default OpenSpec workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Keep Requirements atomic: one independently reviewable rule per
      Requirement, and at least one Scenario for every Requirement as required
      by OpenSpec. If the project defines Requirement IDs, keep each ID unique
      and persistent: preserve it in MODIFIED requirements, never renumber or
      reuse it, and do not encode temporary document status or representation
      form in it. Keep source identifiers as provenance. Do not invent an ID
      namespace when the project defines none.

      In addition to the normative statement and Scenario, use only the forms
      that clarify the rule: a formula or invariant, classifier,
      mapping/permission matrix, decision table, state-transition table or
      diagram, operation contract, displayed-data rule, observable external-
      failure behavior, or observable interface-update behavior.
      These are optional forms, not mandatory sections or separate requirement
      types. Use the name "decision table" for a rule-based algorithm where
      conditions or their combinations select outcomes or actions and rows
      show branching, completeness, or priority more clearly than prose. A genuine
      decision table identifies conditions, outcomes, and relevant rules, plus
      ordering or a hit policy, defaults, and infeasible cases when applicable.
      Use a formula, invariant, classifier, mapping/permission matrix,
      state-transition table, or operation contract when that notation fits
      better. A pure implementation does not by itself turn a rule into a
      decision table. Place applicable forms inside the corresponding Requirement before
      its Scenarios and label them with bold text, not level-4 headings:
      OpenSpec reserves `####` headings for Scenarios. Do not invent nominal
      rules to cover the list. Technical mini mappings belong in design.md.

      Scenarios use WHEN/THEN bullets: `- **GIVEN**` (initial state, only
      when it matters), `- **WHEN**` (trigger), `- **THEN**` (observable
      result), and `- **AND**` for additional guarantees.

      Scenario names are test names. Write each Scenario name in English in
      the form `<what happens> when <condition>`, without the words "should"
      and "test", whatever language the spec body uses: design.md and
      tasks.md reuse the Scenario name verbatim as the name of the unit,
      bloc_test, or golden test that proves it. The GIVEN/WHEN/THEN body
      stays in the language of the spec. Give every observable screen state
      (loading, empty, error, partial, stale, and each loaded variant) its
      own Scenario, so that golden scenarios map to Scenarios 1:1. Example:
      `#### Scenario: keeps the last known balance visible when the refresh runs offline`.

      Client application coverage: the template contains a conditional
      `## Capability Coverage` block with a nine-row coverage table. Keep it
      only when the change is about a client application (a mobile, desktop,
      or web UI); delete the whole block otherwise. When kept, fill each row
      with the requirement(s) that cover the concern or `N/A` with a short
      reason and keep the column that says what needs human confirmation.
      The rows are backend-independent; the realtime/push/sync invalidation
      row applies to any backend that can change data behind the app. Keep
      the table above the delta sections; it is not merged into the main
      spec at archive, so every rule it points to must live in a Requirement.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions, including the offline, timeout,
        pending, empty, partial, and stale states a user can see
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <what happens> when <condition>` with WHEN/THEN bullets
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: downloads a CSV file with all user data when the user clicks Export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs are testable: each Scenario becomes one test with the same name.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Component Coverage** and **Layer Boundaries And Registration**: Conditional sections for a Flutter client on the Surf standard, see below. Delete them otherwise.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      For mini-based implementation, cover only the applicable mappings:
      Resource/registry; CRUDL or aggregate; pure business rules and decision
      seams wherever a rule can be separated from I/O and state. Name the
      actual form - formula, invariant, merge, selector, reducer, classifier,
      or genuine decision table - and include explicit inputs, outputs, and a
      unit-test seam. Cover CustomMethod and owning service; task/integration;
      FSM; SSE, invalidation, and refetch only when applicable. Do not create a
      general inventory of entities or registries. Use an appropriate Mermaid
      diagram when it makes non-trivial interactions, flows, sequences, or
      state models easier to understand; diagrams are not mandatory.

      For a Flutter client on the Surf standard, keep the conditional
      Component Coverage and Layer Boundaries And Registration blocks of the
      template and delete them when the change is not about a Flutter client.
      Map every requirement to the smallest owning component of the closed
      Surf vocabulary. Presentation: Flow (route entry point that provides
      the Assembly), ViewModel (bridge between Bloc and View, read-only
      state), View (pure UI that renders the ViewModel), Widget (reusable UI
      element, typed constructor, no state management). Domain: Entity
      (immutable model), Bloc (Event → State + Action), Event (input signal),
      State (complete UI condition at a point in time), Action (one-time side
      effect such as navigation or a dialog), IRepository (interface for
      external data access), Failure (typed error). Data: Repository
      (implements IRepository), Converter (pure DTO ↔ Entity transform),
      DataSource (single remote or local source). Cross-cutting: Assembly
      (per-feature DI container), Result (explicit success or Failure), DTO
      (transfer object of a datasource), Storage (key-value or secure
      persistence), DAO (relational data access). Every class in the change
      maps to exactly one component. Prohibited: Helper, Service, Manager,
      Handler, or Utils classes, `Provider` as a domain class, a
      feature-level `common/` or `util/` directory; there are no use cases or
      interactors - business logic lives in the Bloc, pure rules in Entities
      or Converters. If a class cannot be mapped to a component, it does not
      belong in the design.

      Layer boundaries are a principle of the design, whatever lint enforces
      them in the project: domain does not depend on data, presentation,
      datasource, or ui; data does not depend on presentation or ui;
      presentation does not depend on data or datasource; a Repository does
      not import other Repositories and a Bloc does not import other Blocs;
      DTOs never leave the datasource; repositories return `Result`;
      exceptions do not cross layers.

      Name the verification seam that proves every requirement. There are
      exactly three seams plus "not covered", one fixed seam per component:
      - Bloc → bloc_test: a mocked IRepository; asserts the State sequence per Event and the Actions through the action stream.
      - Repository → unit: a mocked DataSource; asserts the DTO → Entity mapping into `Result` and `Failure` on exception.
      - Converter, Entity, pure rules → unit: table-driven, inputs as data and one test body; asserts the formulas, invariants, and decision tables from the spec.
      - View → golden: a fake ViewModel; one golden per View with a scenario per State variant.
      - Widget → golden: a scenario per variant and interaction state.
      - Flow, Assembly, DataSource → not covered: glue without logic and generated code; write `not covered` with that reason in the seam column.
      There is no end-to-end seam: a journey is proven by the Bloc's Action
      (bloc_test), the View's golden, and the route registration checked on
      a device in the tasks Definition of Done. The test name is the
      Scenario name from the spec verbatim (`<what happens> when
      <condition>`); the golden scenario name is the State variant name. The
      test file layout, the shared fakes, and the reference tests are project
      facts: take them from the project context and rules, the schema fixes
      only the seam and the name.

      Route registration and Assembly registration are mandatory facts of
      the design: name the route (its path, whether it is initial, who adds
      it) and where the feature Assembly is wired into its parent. How a
      project registers them - through a generator hook or by hand - comes
      from the project context and rules, not from the schema.

      When such a client talks to a mini backend, keep the conditional mini
      client sub-block of the template and cover only what the change
      touches: the generated contract and DTOs and the API version they are
      bound to; CRUDL, `aggregate`, and FSM transitions through the resource
      client; a `CustomMethod` call with its idempotency key and the set of
      resources it invalidates; the rule SSE event → invalidation of the
      Repository or cache → refetch of the active screen state, with REST
      reads staying authoritative; push registration for background
      delivery; the ETag HTTP cache. Each mini client sits behind a
      DataSource; Blocs and Views never see mini types. Delete the sub-block
      when the backend is not mini and describe the actual API contract under
      Decisions instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.

      For a Flutter client on the Surf standard, keep the conditional
      Definition of Done block of the template and delete it when the change
      is not about a Flutter client. The schema names no commands and no
      paths: the commands for formatting, analysis, the test run, code
      generation, and golden regeneration, the generators, and the file
      layout come from the project `context` and `rules` in
      `openspec/config.yaml`; write the project's own commands into the
      tasks, never a guess. In that case also:
      - Order tasks by dependency: Entity and Failure → IRepository → DTO,
        DataSource, Converter, Repository → Bloc (Event, State, Action) →
        ViewModel, View, Widget → Flow, route and Assembly registration.
      - When the verification is a test, name it: the test name is the
        Scenario name from the spec verbatim (`<what happens> when
        <condition>`), and a golden scenario is named after its State
        variant; the test path follows the layout from the project rules.
      - Split the work into merge-request-sized slices and say which slice
        each group belongs to; the MR size limit comes from the project
        rules. A group that cannot fit is split further, not merged larger.
      - Finish with a Definition of Done that keeps, as checkboxes:
        `openspec validate <change> --strict` green; generated code
        committed; the formatting check, the analysis, and the single test
        run green with the project's commands, covering the unit, bloc_test,
        and golden seams from design.md; every new or changed Bloc,
        Repository, Converter, and pure rule has a unit test (bloc_test for
        the Bloc) named after its Scenarios; every new or changed View and
        public Widget has a golden with a scenario per State variant; golden
        snapshots were regenerated only for intended changes and every
        changed snapshot is explained in the MR; route and Assembly
        registration verified on a device or simulator; every MR of the
        change within the project's size limit.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      ```

      Reference specs for what needs to be built, design for how to build it.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
